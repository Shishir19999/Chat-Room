<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat Room: real-time rooms with replies, reactions, mentions, image sharing and search." />
    <meta name="theme-color" content="#f4f5fb" />
    <meta property="og:title" content="Chat Room" />
    <meta property="og:description" content="Real-time chat rooms with replies, reactions, mentions and image sharing." />
    <meta property="og:type" content="website" />
    <title>Chat Room</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('chat:theme'));
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
